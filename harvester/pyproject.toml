[project]
name = "obrifive-harvester"
version = "0.1.0"
description = "Obrifive catalog harvester MCP server"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio>=4.9.0",
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "expects>=0.9.0",
    "ruff>=0.15.22",
    "ty>=0.0.70",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short --strict-markers"
testpaths = "tests"
python_files = "test_*.py"
python_classes = "*Tests"
python_functions = "test_*"
